// ================== CACHE LOCAL + QUEUE ==================
const LocalCache = {
  dbName: 'FFT_Cache', version: 1, db: null,
  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, this.version);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('transactions')) db.createObjectStore('transactions', {keyPath:'id'});
        if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', {keyPath:'tempId', autoIncrement:true});
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = e => reject(e.target.error);
    });
  },
  async save(store, data) {
    if (!this.db) await this.init();
    const tx = this.db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    if (Array.isArray(data)) await Promise.all(data.map(i => os.put(i)));
    else await os.put(data);
  },
  async getAll(store) {
    if (!this.db) await this.init();
    return new Promise(res => {
      const tx = this.db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
    });
  },
  async queue(op) {
    if (!this.db) await this.init();
    this.db.transaction('queue','readwrite').objectStore('queue').add({...op, createdAt: new Date().toISOString()});
  },
  async getQueue() { return this.getAll('queue'); },
  async clearQueueItem(id) {
    if (!this.db) await this.init();
    this.db.transaction('queue','readwrite').objectStore('queue').delete(id);
  },
  async flush() {
    const queue = await this.getQueue();
    let success = 0;
    for (const item of queue) {
      try {
        if (item.action === 'insert_transaction') {
          const {error} = await sb.from('transactions').insert(item.data);
          if (!error) { await this.clearQueueItem(item.tempId); success++; }
        }
      } catch(e) {}
    }
    return success;
  }
};

window.addEventListener('online', async () => {
  isOnline = true; updateConnectionBadge();
  const n = await LocalCache.flush();
  if (n > 0) { toast(n + ' opération(s) synchronisée(s)'); showScreen(currentScreen); }
});
window.addEventListener('offline', () => { isOnline = false; updateConnectionBadge(); });

function updateConnectionBadge() {

  if (el) el.textContent = isOnline ? '🟢' : '⚪';

// ================== UTILS ==================
function formatFCFA(n) { return new Intl.NumberFormat('fr-FR').format(Math.round(n||0)) + ' FCFA'; }
function toast(msg, ms=2500) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function canValidate(role) { return ['Admin','Trésorier','Secrétaire','Commissaire'].includes(role); }
function isBureau(role) { return ['Trésorier','Secrétaire','Commissaire'].includes(role); }
function canProposeRevision(role) { return ['Admin','Président','Président des séances','Secrétaire'].includes(role); }

async function logAudit(action, entityType, entityId, details={}) {
  try {
    await sb.from('audit_logs').insert({
      user_id: currentUser?.id, user_name: currentProfile?.name,
      action, entity_type: entityType, entity_id: entityId, details
    });
  } catch(e) {}
}

// ================== NOTIFICATIONS ==================
async function getPendingActions() {
  if (!currentProfile) return {count:0, items:[], type:null};
  const {data: txs} = await sb.from('transactions').select('id,status,date,description,created_by,validations,type')
    .eq('deleted', false).order('date', {ascending:false});
  if (!txs) return {count:0, items:[], type:null};
  const {data: seen} = await sb.from('notifications_seen').select('transaction_id').eq('user_id', currentUser.id);
  const seenIds = new Set((seen||[]).map(s => s.transaction_id));
  let items = [], type = null;
  if (['Admin','Trésorier','Commissaire'].includes(currentProfile.role)) {
    items = txs.filter(t => t.status==='declare' && !seenIds.has(t.id)); type = 'confirm';
  } else if (isBureau(currentProfile.role)) {
    items = txs.filter(t => {
      if (t.status !== 'encours') return false;
      const key = currentProfile.role==='Trésorier'?'tresorier':currentProfile.role==='Secrétaire'?'secretaire':'commissaire';
      return !t.validations?.[key] && !seenIds.has(t.id);
    }); type = 'validate';
  } else {
    items = txs.filter(t => t.type==='depot' && t.status==='reparti' && t.created_by===currentUser.id && !seenIds.has(t.id));
    type = 'reparti';
  }
  return {count: items.length, items, type};
}
async function markNotificationsSeen(ids) {
  if (!ids.length) return;
  await sb.from('notifications_seen').upsert(ids.map(id => ({user_id: currentUser.id, transaction_id: id})), {onConflict:'user_id,transaction_id'});
}

// ================== AUTH ==================
async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim().toLowerCase();
  const pin = document.getElementById('auth-pin').value.trim();
  const mode = document.getElementById('auth-btn').dataset.mode || 'login';
  if (!email || pin.length < 4) { toast('Email et PIN (min 4) requis'); return; }
  try {
    if (mode === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pin});
      if (error) throw error;
    } else {
      const name = document.getElementById('auth-name').value.trim();
      const role = document.getElementById('auth-role').value;
      if (!name) { toast('Nom requis'); return; }
      const {error} = await sb.auth.signUp({email, password: pin, options:{data:{name, role}}});
      if (error) throw error;
      await new Promise(r => setTimeout(r, 900));
    }
    await loadProfile();
    currentScreen = 'home';
    render();
    toast(mode==='login' ? 'Connecté !' : 'Compte créé !');
    subscribeRealtime();
  } catch(err) { toast(err.message || 'Erreur'); }
}

async function loadProfile() {
  const {data:{user}} = await sb.auth.getUser();
  if (!user) return false;
  currentUser = user;
  const {data: profile} = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (!profile || profile.disabled) { await sb.auth.signOut(); return false; }
  currentProfile = profile;
  await sb.from('profiles').update({last_seen: new Date().toISOString()}).eq('id', user.id);
  await logLogin();
  return true;
}

async function logLogin() {
  try {
    const fp = navigator.userAgent.slice(0,80);
    const {data: prev} = await sb.from('login_logs').select('device_fingerprint').eq('user_id', currentUser.id).limit(5);
    const isNew = !(prev||[]).some(p => p.device_fingerprint === fp);
    await sb.from('login_logs').insert({user_id: currentUser.id, user_agent: navigator.userAgent, device_fingerprint: fp, is_new_device: isNew});
    if (isNew) toast('⚠️ Nouvelle connexion détectée');
  } catch(e) {}
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null; currentProfile = null; currentScreen = 'login';
  render();
}

function subscribeRealtime() {
  sb.channel('tx').on('postgres_changes', {event:'*', schema:'public', table:'transactions'}, () => {
    if (['home','ops'].includes(currentScreen)) showScreen(currentScreen);
  }).subscribe();
}

// ================== RENDER ==================
function render() {
  const app = document.getElementById('app');
  if (!currentUser || !currentProfile) { app.innerHTML = renderLogin(); return; }
  app.innerHTML = `<div class="screen">${renderHeader()}<div id="content"></div></div>${renderBottomNav()}`;
  showScreen(currentScreen === 'login' ? 'home' : currentScreen);
}

}

function renderBottomNav() {
  const items = [

    {id:'ops',icon:'💸',label:'Opérations'},

      ${i.label}
    </div>`).join('')}</div>`;
}

function renderLogin() {
  return `<div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh">
    <div style="text-align:center;margin-bottom:30px">
      <div style="font-size:3rem">💰</div>
      <h1 style="color:var(--primary);margin:10px 0">FamilyFinTracker</h1>
      <p style="color:#64748b">Version cloud synchronisée</p>
    </div>
    <div class="card">
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchAuthTab('login')">Connexion</div>
        <div class="tab" id="tab-register" onclick="switchAuthTab('register')">Créer compte</div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="ex: jean@famille.ci"></div>
      <div class="form-group"><label>PIN (4-6 chiffres)</label><input type="password" id="auth-pin" inputmode="numeric" maxlength="6"></div>
      <div id="reg-extra" class="hidden">
        <div class="form-group"><label>Nom complet</label><input type="text" id="auth-name"></div>
        <div class="form-group"><label>Rôle</label>
          <select id="auth-role">${ROLES.filter(r=>r!=='Admin').map(r=>`<option value="${r}">${r}</option>`).join('')}</select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="auth-btn" data-mode="login" onclick="handleAuth()">Se connecter</button>
    </div>
  </div>`;
}
function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('reg-extra').classList.toggle('hidden', tab==='login');
  document.getElementById('auth-btn').textContent = tab==='login' ? 'Se connecter' : 'Créer le compte';
  document.getElementById('auth-btn').dataset.mode = tab;
}

// ================== SCREENS ==================
async function showScreen(id) {
  currentScreen = id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.getAttribute('onclick')?.includes(`'${id}'`)));
  const content = document.getElementById('content');
  if (!content) return;
  if (id === 'ops') getPendingActions().then(n => markNotificationsSeen(n.items.map(i=>i.id)));
  if (id === 'home') content.innerHTML = await renderHome();
  else if (id === 'ops') content.innerHTML = await renderOps();
  else if (id === 'report') content.innerHTML = await renderReport();
  else if (id === 'meetings') content.innerHTML = await renderMeetings();
  else if (id === 'settings') {
    content.innerHTML = await renderSettings();
    if (currentProfile?.role === 'Admin') setTimeout(loadMembersList, 80);
    loadLoginLogs();
  }
}

async function getTransactions() {
  try {
    if (isOnline) {
      const {data, error} = await sb.from('transactions').select('*').eq('deleted', false).order('date', {ascending:false});
      if (error) throw error;
      await LocalCache.save('transactions', data||[]);
      return data||[];
    } else {
      const cached = await LocalCache.getAll('transactions');
      const queue = await LocalCache.getQueue();
      const pending = queue.filter(q=>q.action==='insert_transaction').map(q=>({...q.data, id:'pending-'+q.tempId, pending_sync:true}));
      return [...pending, ...cached];
    }
  } catch(e) { return await LocalCache.getAll('transactions'); }
}

async function renderHome() {
  const txs = await getTransactions();
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthTxs = txs.filter(t => t.date?.startsWith(thisMonth));
  const depots = monthTxs.filter(t=>t.type==='depot'&&t.status==='reparti').reduce((s,t)=>s+Number(t.amount),0);
  const depenses = monthTxs.filter(t=>t.type==='depense'&&t.status!=='declare').reduce((s,t)=>s+Number(t.amount),0);
  const pending = txs.filter(t=>['declare','confirme','encours'].includes(t.status)).length;
  const notif = await getPendingActions();
  let banner = '';
  if (notif.count > 0) {
    const msg = notif.type==='confirm' ? `🔔 ${notif.count} opération(s) à confirmer` :
                notif.type==='validate' ? `🔔 ${notif.count} répartition(s) à valider` :
                `✅ Votre versement du ${notif.items[0]?.date||''} a été réparti`;
    banner = `<div class="card" style="background:#fef3c7;border-color:#fbbf24;cursor:pointer" onclick="handleBannerClick()">
      <strong>${msg}</strong><div style="font-size:0.8rem;margin-top:4px;color:#92400e">Appuyez pour voir</div></div>`;
  }
  setTimeout(() => {
    const b = document.getElementById('ops-badge');
    if (b) { if (notif.count>0){b.textContent=notif.count>9?'9+':notif.count;b.classList.remove('hidden');} else b.classList.add('hidden'); }
  }, 80);
  return `${banner}
    <div class="grid-2">
      <div class="card stat-card"><div class="stat-value" style="color:var(--success)">${formatFCFA(depots)}</div><div class="stat-label">Dépôts ce mois</div></div>
      <div class="card stat-card"><div class="stat-value" style="color:var(--danger)">${formatFCFA(depenses)}</div><div class="stat-label">Dépenses ce mois</div></div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between"><strong>En attente</strong><span class="badge badge-declare">${pending}</span></div></div>
    <button class="btn btn-primary btn-block" onclick="openAddModal()">+ Nouvelle opération</button>
    <div class="card" style="margin-top:16px"><strong>Dernières opérations</strong>
      <div style="margin-top:12px">${txs.slice(0,6).map(t=>renderTxItem(t)).join('')||'<div class="empty">Aucune opération</div>'}</div>
    </div>`;
}
async function handleBannerClick() {
  const n = await getPendingActions();
  await markNotificationsSeen(n.items.map(i=>i.id));
  showScreen('ops');
}

function renderTxItem(t) {
  const sign = t.type==='depot'?'+':'-';
  const cls = t.type==='depot'?'positive':'negative';
  const pend = t.pending_sync ? ' <span class="badge badge-declare">⏳</span>' : '';
  return `<div class="list-item" onclick="openTxDetail('${t.id}')">
    <div><div style="font-weight:600">${t.description||t.type}${pend}</div>
    <div style="font-size:.8rem;color:#64748b">${t.date} · <span class="badge badge-${t.status}">${STATUSES[t.status]}</span></div></div>
    <div class="amount ${cls}">${sign}${formatFCFA(t.amount)}</div></div>`;
}

async function renderOps() {
  const txs = await getTransactions();
  const f = window._filters || {};
  let list = txs;
  if (f.q) { const q=f.q.toLowerCase(); list=list.filter(t=>(t.description||'').toLowerCase().includes(q)||String(t.amount).includes(q)); }
  if (f.status && f.status!=='all') list=list.filter(t=>t.status===f.status);
  if (f.type && f.type!=='all') list=list.filter(t=>t.type===f.type);
  if (f.cat) list=list.filter(t=>(t.category_splits||[]).some(s=>s.cat===f.cat));
  if (f.dateFrom) list=list.filter(t=>t.date>=f.dateFrom);
  if (f.dateTo) list=list.filter(t=>t.date<=f.dateTo);

  return `<div class="card" style="padding:12px">
    <input type="search" placeholder="Rechercher..." value="${f.q||''}" oninput="window._filters={...window._filters||{},q:this.value};showScreen('ops')" style="margin-bottom:8px">
    <div class="grid-2" style="gap:8px">
      <select onchange="window._filters={...window._filters||{},status:this.value};showScreen('ops')">
        <option value="all">Tous statuts</option>

function closeModal() { document.getElementById('modal')?.remove(); }

async function saveTransaction(isEdit=false) {
  const type = document.getElementById('tx-type').value;
  const amount = Number(document.getElementById('tx-amount').value);
  const date = document.getElementById('tx-date').value;
  const desc = document.getElementById('tx-desc').value.trim();
  if (!amount || amount<=0 || !date) { toast('Montant et date requis'); return; }
  const splits = [];
  document.querySelectorAll('#splits .grid-2').forEach(r => {
    const cat = r.querySelector('.split-cat').value;
    const amt = Number(r.querySelector('.split-amt').value);
    if (amt>0) splits.push({cat, amount:amt});
  });
  let photoTypes = [];
  const file = document.getElementById('tx-photo')?.files[0];
  if (file) {
    const path = `${currentUser.id}/${Date.now()}-${file.name}`;
    const {error} = await sb.storage.from('receipts').upload(path, file);
    if (!error) {
      const url = sb.storage.from('receipts').getPublicUrl(path).data.publicUrl;
      photoTypes.push({url, type: document.getElementById('tx-photo-type')?.value||'autre', uploaded_by: currentUser.id});
    }
  }
  const payload = {
    type, amount, date, description: desc,
    category_splits: splits.length?splits:[{cat:CATEGORIES[0],amount}],
    status: 'declare', created_by: currentUser.id, created_by_name: currentProfile.name,
    photo_types: photoTypes, validations: {tresorier:false,secretaire:false,commissaire:false}
  };
  if (isEdit && window._editingId) {
    await sb.from('transactions').update({...payload, updated_at:new Date().toISOString()}).eq('id', window._editingId);
    logAudit('edit_transaction','transaction',window._editingId,{});
    window._editingId = null; closeModal(); toast('Modifié'); showScreen(currentScreen); return;
  }
  if (!isOnline) {
    await LocalCache.queue({action:'insert_transaction', data:payload});
    closeModal(); toast('Enregistré localement'); showScreen(currentScreen); return;
  }
  const {data, error} = await sb.from('transactions').insert(payload).select().single();
  if (error) { await LocalCache.queue({action:'insert_transaction', data:payload}); toast('Mis en file d’attente'); }
  else { logAudit('create_transaction','transaction',data.id,{amount,type}); toast('Enregistré'); }
  closeModal(); showScreen(currentScreen);
}

async function openTxDetail(id) {
  if (String(id).startsWith('pending-')) { toast('En attente de synchronisation'); return; }
  const {data:t} = await sb.from('transactions').select('*').eq('id',id).single();
  if (!t) return;
  const canAct = canValidate(currentProfile.role);
  const canEdit = (t.created_by===currentUser.id || currentProfile.role==='Admin') && ['declare','confirme'].includes(t.status);
  const canDelete = canEdit || currentProfile.role==='Admin';
  const visiblePhotos = (t.photo_types||[]).filter(p => {
    const typ = p.type||'autre';
    if (typ==='preuve_versement') return p.uploaded_by===currentUser.id || canValidate(currentProfile.role) || currentProfile.role==='Admin';
    if (typ==='justif_depense') return canValidate(currentProfile.role) || currentProfile.role==='Admin';
    if (['recu_banque','releve_compte'].includes(typ)) return ['Admin','Trésorier','Secrétaire','Commissaire','Parent'].includes(currentProfile.role);
    return true;
  });
  const html = `<div class="modal" id="modal"><div class="modal-content">
    <div class="modal-header"><strong>Détail</strong><button class="close-btn" onclick="closeModal()">×</button></div>
    <p><strong>${t.type==='depot'?'Dépôt':'Dépense'}</strong> · ${formatFCFA(t.amount)}</p>
    <p style="color:#64748b;font-size:.9rem">${t.date} · ${t.description||''}</p>
    <p><span class="badge badge-${t.status}">${STATUSES[t.status]}</span></p>
    <div style="margin:12px 0"><strong>Répartition</strong>${(t.category_splits||[]).map(s=>`<div>${s.cat}: ${formatFCFA(s.amount)}</div>`).join('')}</div>
    ${visiblePhotos.length?`<div><strong>Pièces</strong><br>${visiblePhotos.map(p=>`<img src="${p.url}" class="photo-preview">`).join('')}</div>`:''}
    <div style="margin-top:12px"><strong>Validations</strong>
      <div class="validation-row">
        <span class="badge ${t.validations?.tresorier?'badge-reparti':'badge-declare'}">Trésorier ${t.validations?.tresorier?'✓':'○'}</span>
        <span class="badge ${t.validations?.secretaire?'badge-reparti':'badge-declare'}">Secrétaire ${t.validations?.secretaire?'✓':'○'}</span>
        <span class="badge ${t.validations?.commissaire?'badge-reparti':'badge-declare'}">Commissaire ${t.validations?.commissaire?'✓':'○'}</span>
      </div>
    </div>
    ${canAct?renderActions(t):''}
    ${t.status==='reparti'&&canProposeRevision(currentProfile.role)?`<button class="btn btn-outline btn-block" style="margin-top:12px" onclick="openRevisionModal('${t.id}')">🔄 Réviser (AG)</button>`:''}
    ${canEdit?`<button class="btn btn-outline btn-block" style="margin-top:8px" onclick="openEditModal('${t.id}')">✏️ Éditer</button>`:''}
    ${canDelete?`<button class="btn btn-danger btn-block" style="margin-top:8px" onclick="deleteTransaction('${t.id}')">🗑️ Supprimer</button>`:''}
    ${['confirme','encours','reparti'].includes(t.status)?`<button class="btn btn-outline btn-block" style="margin-top:8px" onclick="generateReceipt('${t.id}')">🧾 Reçu</button>`:''}
    <div id="revisions-list" style="margin-top:16px"></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const {data:revs} = await sb.from('revisions').select('*').eq('transaction_id',id).order('created_at',{ascending:false});
  const cont = document.getElementById('revisions-list');
  if (cont && revs?.length) {
    cont.innerHTML = `<strong>Révisions AG</strong>${revs.map(r=>`<div class="card" style="margin-top:8px;padding:12px">
      <div style="font-size:0.85rem"><strong>${r.proposed_by_name}</strong> – ${new Date(r.created_at).toLocaleDateString('fr-FR')}
        <span class="badge ${r.status==='validee'?'badge-reparti':'badge-encours'}">${r.status}</span></div>
      <div style="margin-top:4px">${r.motif}</div>
      ${r.status==='en_cours'&&isBureau(currentProfile.role)?`<button class="btn btn-success" style="margin-top:8px;padding:6px 12px;font-size:0.8rem"
        onclick="validateRevision('${r.id}','${currentProfile.role==='Trésorier'?'tresorier':currentProfile.role==='Secrétaire'?'secretaire':'commissaire'}')">Valider</button>`:''}
    </div>`).join('')}`;

function renderActions(t) {
  let b = '';
  if (t.status==='declare') b += `<button class="btn btn-primary btn-block" onclick="changeStatus('${t.id}','confirme')">Confirmer</button>`;
  if (t.status==='confirme') b += `<button class="btn btn-primary btn-block" onclick="changeStatus('${t.id}','encours')">En cours</button>`;
  if (t.status==='encours' && isBureau(currentProfile.role)) {
    const key = currentProfile.role==='Trésorier'?'tresorier':currentProfile.role==='Secrétaire'?'secretaire':'commissaire';
    if (!t.validations?.[key]) b += `<button class="btn btn-success btn-block" onclick="validateRepartition('${t.id}','${key}')">Valider (mon rôle)</button>`;
  }
  if (t.status==='encours' && currentProfile.role==='Admin') b += `<button class="btn btn-success btn-block" onclick="forceReparti('${t.id}')">Forcer Réparti</button>`;
  return b;
}

async function changeStatus(id, status) {

  logAudit('change_status','transaction',id,{status});
  closeModal(); toast('Statut mis à jour'); showScreen(currentScreen);
}
async function validateRepartition(id, key) {
  const {data:t} = await sb.from('transactions').select('*').eq('id',id).single();
  const vals = {...(t.validations||{}), [key]:true};
  let status = t.status;
  if (vals.tresorier && vals.secretaire && vals.commissaire) { status='reparti'; toast('Réparti !'); }
  else toast('Validation enregistrée');
  await sb.from('transactions').update({validations:vals, status, updated_at:new Date().toISOString()}).eq('id',id);
  logAudit('validate_repartition','transaction',id,{key});
  closeModal(); showScreen(currentScreen);
}
async function forceReparti(id) {
  await sb.from('transactions').update({status:'reparti', validations:{tresorier:true,secretaire:true,commissaire:true}}).eq('id',id);
  logAudit('force_reparti','transaction',id,{});

async function saveRevision(txId) {
  const motif = document.getElementById('rev-motif').value.trim();
  if (!motif) { toast('Motif obligatoire'); return; }
  const splits=[];
  document.querySelectorAll('#rev-splits .grid-2').forEach(r=>{
    const cat=r.querySelector('.split-cat').value; const amt=Number(r.querySelector('.split-amt').value);
    if (amt>0) splits.push({cat,amount:amt});
  });
  if (!splits.length) { toast('Catégories requises'); return; }
  let pvUrl=null;
  const file=document.getElementById('rev-photo').files[0];
  if (file) {
    const path=`revisions/${currentUser.id}/${Date.now()}-${file.name}`;
    const {error}=await sb.storage.from('receipts').upload(path,file);
    if (!error) pvUrl=sb.storage.from('receipts').getPublicUrl(path).data.publicUrl;
  }
  const {error}=await sb.from('revisions').insert({
    transaction_id:txId, motif, new_splits:splits, pv_reference:document.getElementById('rev-pv').value.trim()||null,
    pv_photo_url:pvUrl, proposed_by:currentUser.id, proposed_by_name:currentProfile.name
  });
  if (error) toast(error.message); else { closeModal(); toast('Révision proposée'); showScreen(currentScreen); logAudit('propose_revision','revision',txId,{motif}); }
}
async function validateRevision(revId, key) {
  const {data:rev}=await sb.from('revisions').select('*').eq('id',revId).single();
  const vals={...(rev.validations||{}),[key]:true};
  let status=rev.status, validated_at=null;
  if (vals.tresorier&&vals.secretaire&&vals.commissaire) {
    status='validee'; validated_at=new Date().toISOString();
    await sb.from('transactions').update({category_splits:rev.new_splits}).eq('id',rev.transaction_id);
    toast('Révision appliquée');
  }
  await sb.from('revisions').update({validations:vals,status,validated_at}).eq('id',revId);
  logAudit('validate_revision','revision',revId,{key});
  closeModal(); showScreen(currentScreen);
}

async function renderReport() {
  const txs = await getTransactions();
  const months = [...new Set(txs.map(t=>t.date?.slice(0,7)).filter(Boolean))].sort().reverse();
  const selected = window._reportMonth || (months[0]||new Date().toISOString().slice(0,7));
  const monthTxs = txs.filter(t=>t.date?.startsWith(selected));
  setTimeout(()=>renderCharts(monthTxs, txs), 120);
  return `<div class="form-group"><label>Mois</label>
    <select onchange="window._reportMonth=this.value;showScreen('report')">
      ${months.map(m=>`<option value="${m}" ${m===selected?'selected':''}>${m}</option>`).join('')||`<option>${selected}</option>`}
    </select></div>
    <div class="card"><canvas id="chartPie" height="200"></canvas></div>
    <div class="card"><canvas id="chartLine" height="200"></canvas></div>
    <div class="card"><canvas id="chartBar" height="200"></canvas></div>
    <button class="btn btn-outline btn-block" onclick="printMonthlyReport('${selected}')">📄 Exporter</button>`;
}
function renderCharts(monthTxs, allTxs) {
  const byCat={};
  monthTxs.forEach(t=>(t.category_splits||[]).forEach(s=>{
    byCat[s.cat]=byCat[s.cat]||{depot:0,depense:0};
    if (t.type==='depot') byCat[s.cat].depot+=Number(s.amount); else byCat[s.cat].depense+=Number(s.amount);
  }));
  const ctxP=document.getElementById('chartPie');
  if (ctxP) new Chart(ctxP,{type:'doughnut',data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat).map(v=>v.depot+v.depense),backgroundColor:['#0f766e','#14b8a6','#2dd4bf','#5eead4','#99f6e4','#ccfbf1','#f0fdfa','#134e4a']}]},options:{plugins:{title:{display:true,text:'Par catégorie'}}}});
  const last6=[]; for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);last6.push(d.toISOString().slice(0,7));}
  let solde=0; const soldes=last6.map(m=>{allTxs.filter(t=>t.date?.startsWith(m)).forEach(t=>{solde+=t.type==='depot'?Number(t.amount):-Number(t.amount);});return solde;});
  const ctxL=document.getElementById('chartLine');
  if (ctxL) new Chart(ctxL,{type:'line',data:{labels:last6,datasets:[{label:'Solde',data:soldes,borderColor:'#0f766e',tension:0.3}]},options:{plugins:{title:{display:true,text:'Évolution 6 mois'}}}});
  const contrib={}; monthTxs.filter(t=>t.type==='depot').forEach(t=>{contrib[t.created_by_name||'?']=(contrib[t.created_by_name||'?']||0)+Number(t.amount);});
  const top=Object.entries(contrib).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const ctxB=document.getElementById('chartBar');
  if (ctxB) new Chart(ctxB,{type:'bar',data:{labels:top.map(t=>t[0]),datasets:[{label:'Dépôts',data:top.map(t=>t[1]),backgroundColor:'#0f766e'}]},options:{plugins:{title:{display:true,text:'Top contributeurs'}}}});
}
function printMonthlyReport(month) {
  getTransactions().then(txs=>{
    const list=txs.filter(t=>t.date?.startsWith(month));
    const w=window.open('','_blank');
    w.document.write(`<html><head><title>Rapport ${month}</title><style>body{font-family:sans-serif;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}th{background:#0f766e;color:#fff}</style></head><body>

      <tbody>${list.map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${t.description||''}</td><td>${formatFCFA(t.amount)}</td><td>${STATUSES[t.status]}</td></tr>`).join('')}</tbody></table>

    w.document.close();

}

function openCreateMeeting() {
  const html=`<div class="modal" id="modal"><div class="modal-content">
    <div class="modal-header"><strong>Nouvelle réunion</strong><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Titre</label><input type="text" id="meet-title"></div>
    <div class="form-group"><label>Date/heure</label><input type="datetime-local" id="meet-date"></div>
    <div class="form-group"><label>Ordre du jour</label><textarea id="meet-agenda" rows="3"></textarea></div>
    <div class="form-group"><label>Quorum</label><input type="number" id="meet-quorum" value="0"></div>
    <button class="btn btn-primary btn-block" onclick="createMeeting()">Créer</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function createMeeting() {
  const title=document.getElementById('meet-title').value.trim();
  const date=document.getElementById('meet-date').value;
  if (!title||!date){toast('Titre et date requis');return;}
  await sb.from('meetings').insert({title,date,agenda:document.getElementById('meet-agenda').value,quorum_required:Number(document.getElementById('meet-quorum').value)||0,created_by:currentUser.id});
  closeModal(); toast('Réunion créée'); showScreen('meetings');
}
async function openMeetingDetail(id) {
  const {data:m}=await sb.from('meetings').select('*').eq('id',id).single();
  const {data:att}=await sb.from('attendances').select('*').eq('meeting_id',id);
  const {data:profiles}=await sb.from('profiles').select('id,name').eq('disabled',false);
  const present=new Set((att||[]).filter(a=>a.present).map(a=>a.user_id));
  const html=`<div class="modal" id="modal"><div class="modal-content">
    <div class="modal-header"><strong>${m.title}</strong><button class="close-btn" onclick="closeModal()">×</button></div>
    <p>${new Date(m.date).toLocaleString('fr-FR')}</p><p style="font-size:0.9rem">${m.agenda||''}</p>
    <p>Quorum: ${m.quorum_required} · Présents: ${present.size}</p><strong>Présences</strong>
    ${(profiles||[]).map(p=>`<div class="list-item"><div>${p.name}</div>
      <input type="checkbox" ${present.has(p.id)?'checked':''} onchange="markAttendance('${id}','${p.id}',this.checked)"></div>`).join('')}
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function markAttendance(mid, uid, present) {
  await sb.from('attendances').upsert({meeting_id:mid,user_id:uid,present,marked_at:new Date().toISOString()},{onConflict:'meeting_id,user_id'});
}

// ================== SETTINGS ==================
async function renderSettings() {
  return `<div class="card">
    <strong>Mon profil</strong>
    <p style="margin-top:8px">${currentProfile.name}<br>${currentProfile.email}<br><span class="role-badge">${currentProfile.role}</span></p>
    <button class="btn btn-outline btn-block" onclick="logout()">Se déconnecter</button>
  </div>
  ${currentProfile.role==='Admin'?`<div class="card"><strong>Gestion des membres</strong>
    <div id="members-list" style="margin-top:12px">Chargement…</div>
    <button class="btn btn-outline btn-block" style="margin-top:12px" onclick="openAddMemberModal()">+ Ajouter un membre</button></div>`:''}
  ${['Admin','Commissaire'].includes(currentProfile.role)?`<div class="card"><strong>Journal d'audit</strong>
    <button class="btn btn-outline btn-block" onclick="showAuditLogs()">Voir le journal</button></div>`:''}
  <div class="card"><strong>Sauvegarde & Sync</strong>
    <button class="btn btn-primary btn-block" onclick="exportJSON()">📤 Exporter JSON</button>
    <button class="btn btn-outline btn-block" onclick="manualSync()">🔄 Synchroniser maintenant</button>
  </div>
  <div class="card"><strong>Mes connexions récentes</strong><div id="login-logs">Chargement…</div></div>`;
}

async function loadMembersList() {
  const c=document.getElementById('members-list'); if (!c) return;
  const {data:profiles}=await sb.from('profiles').select('*').order('name');
  c.innerHTML=(profiles||[]).map(u=>`<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px">
    <div style="display:flex;justify-content:space-between">
      <div><strong>${u.name}</strong> ${u.disabled?'<span class="badge badge-declare">Désactivé</span>':''}
        <div style="font-size:0.8rem;color:#64748b">${u.email}</div>
        <div style="font-size:0.75rem">Vu: ${u.last_seen?new Date(u.last_seen).toLocaleString('fr-FR'):'Jamais'}</div>
      </div><span class="role-badge">${u.role}</span>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <select onchange="changeRole('${u.id}',this.value)" style="flex:1;padding:6px;font-size:0.8rem">
        ${ROLES.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r}</option>`).join('')}
      </select>
      <button class="btn ${u.disabled?'btn-success':'btn-danger'}" style="padding:6px 10px;font-size:0.8rem"
        onclick="toggleDisableMember('${u.id}',${!u.disabled})">${u.disabled?'Réactiver':'Désactiver'}</button>
    </div></div>`).join('');
}
async function changeRole(uid, role) {
  await sb.from('profiles').update({role}).eq('id',uid);
  logAudit('change_role','profile',uid,{role}); toast('Rôle mis à jour'); loadMembersList();
}
async function toggleDisableMember(uid, disable) {
  await sb.from('profiles').update({disabled:disable}).eq('id',uid);
  toast(disable?'Désactivé':'Réactivé'); loadMembersList();
}
function openAddMemberModal() {
  const html=`<div class="modal" id="modal"><div class="modal-content">
    <div class="modal-header"><strong>Ajouter un membre</strong><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Nom</label><input type="text" id="new-member-name"></div>
    <div class="form-group"><label>Email</label><input type="email" id="new-member-email"></div>
    <div class="form-group"><label>Rôle</label><select id="new-member-role">${ROLES.filter(r=>r!=='Admin').map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
    <div class="form-group"><label>PIN temporaire</label><input type="text" id="new-member-pin" inputmode="numeric" maxlength="6"></div>
    <button class="btn btn-primary btn-block" onclick="addMember()">Créer</button>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function addMember() {
  const name=document.getElementById('new-member-name').value.trim();
  const email=document.getElementById('new-member-email').value.trim().toLowerCase();
  const role=document.getElementById('new-member-role').value;
  const pin=document.getElementById('new-member-pin').value.trim();
  if (!name||!email||pin.length<4){toast('Champs obligatoires');return;}
  const {error}=await sb.auth.signUp({email,password:pin,options:{data:{name,role}}});
  if (error) toast(error.message); else {closeModal();toast('Membre créé');loadMembersList();logAudit('create_member','profile',null,{email,role});}
}

async function showAuditLogs() {
  const {data:logs}=await sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(50);
  const html=`<div class="modal" id="modal"><div class="modal-content">
    <div class="modal-header"><strong>Journal d'audit</strong><button class="close-btn" onclick="closeModal()">×</button></div>
    ${(logs||[]).map(l=>`<div class="list-item" style="flex-direction:column;align-items:flex-start">
      <div><strong>${l.action}</strong> – ${l.user_name} <span style="font-size:0.75rem;color:#64748b">${new Date(l.created_at).toLocaleString('fr-FR')}</span></div>
      <div style="font-size:0.8rem">${l.entity_type}</div></div>`).join('')||'<div class="empty">Aucun log</div>'}
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

async function loadLoginLogs() {
  const c=document.getElementById('login-logs'); if (!c) return;
  const {data}=await sb.from('login_logs').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(8);
  c.innerHTML=(data||[]).map(l=>`<div style="font-size:0.8rem;padding:6px 0;border-bottom:1px solid #e2e8f0">
    ${new Date(l.created_at).toLocaleString('fr-FR')} ${l.is_new_device?'🆕':''}<br><span style="color:#64748b">${(l.user_agent||'').slice(0,60)}</span>
  </div>`).join('')||'<div class="empty">Aucune connexion</div>';
}

async function exportJSON() {
  const txs=await getTransactions();
  const {data:profiles}=await sb.from('profiles').select('*');
  const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),profiles,transactions:txs},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`FamilyFinTracker_${new Date().toISOString().slice(0,10)}.json`; a.click();
  toast('Export téléchargé');
}
async function manualSync() {
  toast('Synchronisation…');
  const n=await LocalCache.flush();
  toast(n>0?`${n} opération(s) envoyée(s)`:'Rien à synchroniser');
}

// ================== INIT ==================
async function init() {
  await LocalCache.init();
  const {data:{session}}=await sb.auth.getSession();
  if (session) {
    await loadProfile();
    if (currentProfile) { currentScreen='home'; subscribeRealtime(); }
  }
  render();
// Service Worker désactivé temporairement
// if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
